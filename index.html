
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Neptoon Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
    }

    input {
      width: 90px;
      padding: 8px;
    }

    button {
      padding: 9px 15px;
      cursor: pointer;
    }

    .portfolio {
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    .portfolio strong {
      color: #4E79BD;
    }

    #status {
      color: #666;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h2>Neptoon Calculator</h2>

  <input id="a" type="number" value="10">
  +
  <input id="b" type="number" value="20">

  <button onclick="calculate()">
    Calculate
  </button>

  <h3 id="result">Y = 30</h3>

  <hr>

  <h2>Neptoon Science Portfolios</h2>

  <button onclick="loadPortfolios()">
    Load portfolios from GitHub
  </button>

  <div id="status"></div>
  <div id="portfolios"></div>

  <script>

    const PORTFOLIO_URL =
      "https://neptooninvest.github.io/neptoon-data/portfolios_v1.json";

    const MODEL_NUMBERS = [3, 4, 5, 6, 7];

    function calculate(){

      const a = Number(
        document.getElementById("a").value
      );

      const b = Number(
        document.getElementById("b").value
      );

      document.getElementById("result")
        .textContent = "Y = " + (a + b);

    }

    async function loadPortfolios(){

      const status =
        document.getElementById("status");

      const container =
        document.getElementById("portfolios");

      status.textContent =
        "Loading portfolios...";

      container.replaceChildren();

      try {

        const response =
          await fetch(PORTFOLIO_URL);

        if(!response.ok){
          throw new Error(
            "HTTP " + response.status
          );
        }

        const data =
          await response.json();

        const portfolios =
          (data.portfolios || [])
            .filter(p =>
              MODEL_NUMBERS.includes(
                Number(p.modelNo)
              )
            )
            .sort(
              (a,b) =>
                Number(a.modelNo) -
                Number(b.modelNo)
            );

        if(portfolios.length !== 5){
          throw new Error(
            "Expected 5 Science portfolios, found " +
            portfolios.length
          );
        }

        portfolios.forEach((p, index) => {

          const metrics =
            p.objKeyFigures || {};

          const div =
            document.createElement("div");

          div.className = "portfolio";

          const name =
            document.createElement("strong");

          name.textContent =
            "Risk " + (index + 1) +
            " / 5 — " +
            (p.modelLabel || "Unnamed model");

          const details =
            document.createElement("div");

          const ret =
            Number(metrics.expRetNet);

          const risk =
            Number(metrics.risk);

          details.textContent =
            "Model " + p.modelNo +
            " | Expected return: " +
            (Number.isFinite(ret)
              ? (ret * 100).toFixed(2) + "%"
              : "N/A") +
            " | Risk: " +
            (Number.isFinite(risk)
              ? (risk * 100).toFixed(2) + "%"
              : "N/A");

          div.append(name, details);
          container.appendChild(div);

        });

        status.textContent =
          "Successfully loaded " +
          portfolios.length +
          " portfolios from GitHub.";

      } catch(err){

        console.error(err);

        status.textContent =
          "Error: " + err.message;

      }

    }

  </script>

</body>
</html>
